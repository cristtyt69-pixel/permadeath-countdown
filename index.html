.background::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 25%,rgba(0,0,0,.45) 100%);}
main{width:min(100%,980px);padding:clamp(20px,5vw,56px);text-align:center}
.kicker{text-transform:uppercase;letter-spacing:.24em;font-size:clamp(11px,2vw,14px);color:#ffb5b5;opacity:.9}

.number{display:block;font-variant-numeric:tabular-nums;font-size:clamp(28px,6vw,64px);font-weight:800;color:#fff;line-height:1.1;text-shadow:0 0 18px rgba(255,0,0,.45)}
.label{display:block;margin-top:8px;font-size:clamp(9px,1.6vw,12px);letter-spacing:.15em;color:#ffb5b5}
.note{font-size:clamp(12px,2vw,16px);color:#e6caca;letter-spacing:.04em}
#final{display:none;margin-top:28px;font-size:clamp(24px,5vw,46px);font-weight:900;line-height:1.25;text-transform:uppercase;text-shadow:0 0 22px red;animation:flare 1.5s infinite alternate}
@keyframes flare{from{text-shadow:0 0 8px #ff1616}to{text-shadow:0 0 28px #ff0000,0 0 55px #8b0000}}
@media(max-width:480px){.timer{grid-template-columns:repeat(2,1fr)}main{padding:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="background" aria-hidden="true"></div>
<main>
<div class="kicker">PermadeatH</div>
<h1>Inicia en</h1>
<div class="timer" id="timer" aria-label="Cuenta regresiva">
<div class="unit"><span class="number" id="days">0</span><span class="label">DÍAS</span></div>
<div class="unit"><span class="number" id="hours">00</span><span class="label">HORAS</span></div>
<div class="unit"><span class="number" id="minutes">00</span><span class="label">MINUTOS</span></div>
<div class="unit"><span class="number" id="seconds">00</span><span class="label">SEGUNDOS</span></div>
</div>
<div class="note" id="note">4 DE DICIEMBRE · 4:00 PM · HORA DE MÉXICO</div>
<div id="final">Comienza el sufrimiento,<br>COMIENZA PERMADEATH 🔥💀🔥💀🔥</div>
</main>
<script>
// Objetivo: 4 de diciembre de 2026, 16:00 en México (UTC-6).
const target = new Date('2026-12-04T16:00:00-06:00').getTime();
const $ = id => document.getElementById(id);
function tick() {
  const left = target - Date.now();
  if (left <= 0) {
    $('timer').style.display = 'none';
    $('note').style.display = 'none';
    $('final').style.display = 'block';
    return;
  }
  $('days').textContent = String(Math.floor(left / 86400000));
  $('hours').textContent = String(Math.floor(left / 3600000 % 24)).padStart(2,'0');
  $('minutes').textContent = String(Math.floor(left / 60000 % 60)).padStart(2,'0');
  $('seconds').textContent = String(Math.floor(left / 1000 % 60)).padStart(2,'0');
}
tick(); setInterval(tick,1000);
</script>
</body>
</html>
